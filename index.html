<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roleta do Rolê | Canaã dos Carajás</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #07111f, #101d33, #25123c);
            color: white;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 30px 20px 50px;
        }

        /* ==============================
           CABEÇALHO
        ============================== */

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 8px;
        }

        header h1 span {
            color: #fbbf24;
        }

        header p {
            color: #aab5c8;
            font-size: 16px;
        }

        /* ==============================
           LAYOUT
        ============================== */

        .main {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 25px;
        }

        .card {
            background: #111827;
            border: 1px solid #293449;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }

        /* ==============================
           ROLETA
        ============================== */

        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 560px;
            margin: auto;
        }

        #wheel {
            width: 100%;
            height: auto;
            display: block;
        }

        .pointer {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;

            width: 0;
            height: 0;

            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 42px solid white;

            filter: drop-shadow(0 5px 4px rgba(0,0,0,0.6));
        }

        .spin-button {
            width: 100%;
            margin-top: 25px;
            padding: 18px;

            border: none;
            border-radius: 15px;

            background: linear-gradient(
                135deg,
                #facc15,
                #f97316
            );

            color: #111827;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .spin-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(249,115,22,0.35);
        }

        .spin-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ==============================
           RESULTADO
        ============================== */

        .result {
            background: #182235;
            border: 1px solid #2d3a51;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .result-label {
            color: #fbbf24;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .result h2 {
            margin-top: 8px;
            margin-bottom: 5px;
            font-size: 25px;
        }

        .result p {
            color: #aab5c8;
        }

        /* ==============================
           LISTA
        ============================== */

        .list-title {
            margin-bottom: 15px;
            font-size: 16px;
            color: #d9e0ea;
        }

        .place {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 12px;

            border-radius: 12px;

            margin-bottom: 8px;

            transition: 0.3s;

            border: 1px solid transparent;
        }

        .place:hover {
            background: #182235;
        }

        .place.active {
            background: #332a16;
            border-color: #fbbf24;
            transform: translateX(5px);
        }

        .color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .place-info {
            flex: 1;
        }

        .place-info strong {
            display: block;
            font-size: 14px;
        }

        .place-info small {
            color: #8f9bb0;
        }

        .tag {
            background: #263247;
            color: #cbd5e1;

            padding: 5px 8px;

            border-radius: 20px;

            font-size: 11px;
        }

        footer {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 30px;
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 800px) {

            .container {
                padding: 20px 12px;
            }

            header h1 {
                font-size: 32px;
            }

            .main {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 16px;
            }

            .right-card {
                margin-top: 5px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>🎡 Roleta do <span>Rolê</span></h1>

        <p>
            Canaã dos Carajás • A roleta decide onde vamos comer hoje.
        </p>
    </header>


    <main class="main">

        <!-- ROLETA -->

        <section class="card">

            <div class="wheel-container">

                <div class="pointer"></div>

                <canvas
                    id="wheel"
                    width="700"
                    height="700">
                </canvas>

            </div>

            <button
                id="spinButton"
                class="spin-button">

                🎲 GIRAR A ROLETA

            </button>

        </section>


        <!-- PAINEL DIREITO -->

        <section class="card right-card">

            <div
                id="result"
                class="result">

                <span class="result-label">
                    DESTINO DA NOITE
                </span>

                <h2>
                    🍴 Quem vai escolher?
                </h2>

                <p>
                    Clique em girar e deixe a sorte decidir.
                </p>

            </div>


            <h3 class="list-title">
                🍽️ Lugares participantes
            </h3>


            <div id="placesList"></div>

        </section>

    </main>


    <footer>
        Roleta do Rolê • Canaã dos Carajás - PA
    </footer>

</div>


<script>

    /* ==============================
       RESTAURANTES
    ============================== */

    const places = [

        {
            name: "Tex Burguer",
            type: "Hamburgueria",
            emoji: "🍔"
        },

        {
            name: "Blue Chips Burger",
            type: "Hamburgueria",
            emoji: "🍔"
        },

        {
            name: "La Brasa Burger",
            type: "Hamburgueria",
            emoji: "🔥"
        },

        {
            name: "Brasa's Burguer",
            type: "Hamburgueria",
            emoji: "🥩"
        },

        {
            name: "Quality Pizzaria",
            type: "Pizzaria",
            emoji: "🍕"
        },

        {
            name: "Nap'S Pizzaria",
            type: "Pizzaria",
            emoji: "🍕"
        },

        {
            name: "Pizzaria Artezanale",
            type: "Pizzaria",
            emoji: "🍕"
        },

        {
            name: "Sr. Petisco",
            type: "Petiscaria",
            emoji: "🍟"
        },

        {
            name: "Texano",
            type: "Bar / Petiscos",
            emoji: "🍻"
        },

        {
            name: "Conexão Espetaria",
            type: "Espetaria",
            emoji: "🍢"
        }

    ];


    /* ==============================
       CORES
    ============================== */

    const colors = [

        "#ef4444",
        "#f97316",
        "#eab308",
        "#22c55e",
        "#14b8a6",
        "#06b6d4",
        "#3b82f6",
        "#6366f1",
        "#a855f7",
        "#ec4899"

    ];


    /* ==============================
       ELEMENTOS
    ============================== */

    const canvas =
        document.getElementById("wheel");

    const ctx =
        canvas.getContext("2d");

    const button =
        document.getElementById("spinButton");

    const result =
        document.getElementById("result");

    const placesList =
        document.getElementById("placesList");


    let rotation = 0;

    let spinning = false;


    /* ==============================
       CRIAR LISTA
    ============================== */

    function createList() {

        placesList.innerHTML = "";

        places.forEach((place, index) => {

            const div =
                document.createElement("div");

            div.className = "place";

            div.id = "place-" + index;

            div.innerHTML = `

                <div
                    class="color"
                    style="background:${colors[index]}">
                </div>

                <div class="place-info">

                    <strong>
                        ${place.emoji}
                        ${place.name}
                    </strong>

                    <small>
                        ${place.type}
                    </small>

                </div>

                <span class="tag">
                    Canaã
                </span>

            `;

            placesList.appendChild(div);

        });

    }


    /* ==============================
       DESENHAR ROLETA
    ============================== */

    function drawWheel() {

        const centerX = 350;
        const centerY = 350;

        const radius = 320;

        const slice =
            (Math.PI * 2) / places.length;


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.save();

        ctx.translate(
            centerX,
            centerY
        );

        ctx.rotate(rotation);


        places.forEach((place, index) => {

            const start =
                index * slice -
                Math.PI / 2 -
                slice / 2;


            /* FATIA */

            ctx.beginPath();

            ctx.moveTo(0,0);

            ctx.arc(
                0,
                0,
                radius,
                start,
                start + slice
            );

            ctx.closePath();

            ctx.fillStyle =
                colors[index];

            ctx.fill();


            /* LINHA */

            ctx.strokeStyle =
                "rgba(255,255,255,0.7)";

            ctx.lineWidth = 3;

            ctx.stroke();


            /* TEXTO */

            ctx.save();

            ctx.rotate(
                start +
                slice / 2
            );

            ctx.translate(
                radius * 0.62,
                0
            );

            ctx.rotate(
                Math.PI / 2
            );

            ctx.fillStyle = "white";

            ctx.font =
                "bold 19px Arial";

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";


            ctx.shadowColor =
                "rgba(0,0,0,0.7)";

            ctx.shadowBlur = 4;


            let text =
                place.name;

            if(text.length > 18) {

                text =
                    text.substring(0,17)
                    + "...";

            }


            ctx.fillText(
                text,
                0,
                0
            );


            ctx.restore();

        });


        /* CENTRO */

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            65,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#111827";

        ctx.fill();


        ctx.strokeStyle =
            "white";

        ctx.lineWidth = 7;

        ctx.stroke();


        ctx.font =
            "38px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.shadowBlur = 0;

        ctx.fillText(
            "🍴",
            0,
            3
        );


        ctx.restore();

    }


    /* ==============================
       DESCOBRIR VENCEDOR
    ============================== */

    function getWinner() {

        const slice =
            (Math.PI * 2)
            / places.length;


        let normalized =

            ((-rotation %
            (Math.PI * 2))

            +

            (Math.PI * 2))

            %

            (Math.PI * 2);


        const index =

            Math.round(
                normalized /
                slice
            )

            %

            places.length;


        return index;

    }


    /* ==============================
       DESTACAR RESULTADO
    ============================== */

    function highlightWinner(index) {

        document
            .querySelectorAll(".place")
            .forEach(item => {

                item.classList
                    .remove("active");

            });


        const winner =

            document.getElementById(
                "place-" + index
            );


        winner.classList
            .add("active");


        winner.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
        });

    }


    /* ==============================
       GIRAR
    ============================== */

    button.addEventListener(
        "click",
        function() {

            if(spinning) return;


            spinning = true;


            button.disabled = true;

            button.innerHTML =
                "🎡 GIRANDO...";


            /* ENTRE 7 E 11 VOLTAS */

            const turns =
                7 +
                Math.random() * 4;


            const randomPosition =
                Math.random()
                *
                Math.PI
                *
                2;


            const totalRotation =

                turns *
                Math.PI *
                2

                +

                randomPosition;


            const initialRotation =
                rotation;


            const duration =
                5000;


            const startTime =
                performance.now();


            function animate(time) {

                const elapsed =
                    time - startTime;


                let progress =
                    elapsed /
                    duration;


                if(progress > 1) {

                    progress = 1;

                }


                /*
                   DESACELERAÇÃO
                   SUAVE
                */

                const easing =

                    1 -

                    Math.pow(
                        1 - progress,
                        4
                    );


                rotation =

                    initialRotation

                    +

                    totalRotation
                    *
                    easing;


                drawWheel();


                if(progress < 1) {

                    requestAnimationFrame(
                        animate
                    );

                }

                else {

                    finishSpin();

                }

            }


            requestAnimationFrame(
                animate
            );

        }
    );


    /* ==============================
       FINAL DO GIRO
    ============================== */

    function finishSpin() {

        spinning = false;


        button.disabled = false;

        button.innerHTML =
            "🔄 GIRAR NOVAMENTE";


        const winnerIndex =
            getWinner();


        const winner =
            places[winnerIndex];


        highlightWinner(
            winnerIndex
        );


        result.innerHTML = `

            <span class="result-label">

                🎉 DESTINO ESCOLHIDO

            </span>

            <h2>

                ${winner.emoji}
                ${winner.name}

            </h2>

            <p>

                ${winner.type}
                •
                Canaã dos Carajás

            </p>

        `;

    }


    /* ==============================
       INICIAR
    ============================== */

    createList();

    drawWheel();

</script>


</body>
</html>
