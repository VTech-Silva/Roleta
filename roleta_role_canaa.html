<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roleta do Rolê — Canaã dos Carajás</title>
<style>
:root{
  --bg:#080b12; --card:#111827; --text:#f8fafc; --muted:#94a3b8;
  --accent:#fbbf24; --line:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--text); background:
  radial-gradient(circle at 20% 10%,#172554 0,transparent 30%),
  radial-gradient(circle at 80% 80%,#3f0d35 0,transparent 30%),var(--bg);
}
.wrap{width:min(1180px,94%);margin:auto;padding:32px 0 50px}
header{text-align:center;margin-bottom:24px}
header h1{font-size:clamp(2rem,5vw,4rem);margin:0;font-weight:900;letter-spacing:-.05em}
header p{color:var(--muted);margin:8px 0 0}
.grid{display:grid;grid-template-columns:minmax(320px,1.05fr) minmax(300px,.95fr);gap:24px}
.panel{background:rgba(17,24,39,.78);border:1px solid var(--line);border-radius:28px;padding:24px;backdrop-filter:blur(16px);box-shadow:0 20px 70px rgba(0,0,0,.35)}
.wheel-area{display:grid;place-items:center;position:relative;padding:20px}
.pointer{
 position:absolute;top:4px;z-index:4;width:0;height:0;
 border-left:18px solid transparent;border-right:18px solid transparent;border-top:36px solid #fff;
 filter:drop-shadow(0 5px 6px #000)
}
canvas{width:min(100%,560px);height:auto;filter:drop-shadow(0 20px 30px rgba(0,0,0,.4))}
.spin{
 margin-top:20px;width:100%;border:0;border-radius:18px;padding:17px 24px;font-size:1.05rem;font-weight:900;
 cursor:pointer;color:#111827;background:linear-gradient(135deg,#fde047,#fb923c);
 box-shadow:0 12px 30px rgba(251,191,36,.22);transition:.2s transform
}
.spin:hover{transform:translateY(-2px)} .spin:disabled{opacity:.55;cursor:not-allowed}
.result{min-height:118px;margin-bottom:18px;padding:20px;border-radius:22px;background:rgba(255,255,255,.055);border:1px solid var(--line)}
.result small{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.result h2{margin:7px 0 4px;font-size:1.65rem}.result p{margin:0;color:#cbd5e1}
.list{display:grid;gap:10px}
.place{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:15px;border:1px solid transparent;transition:.25s}
.place.active{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.45);transform:translateX(5px)}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.info{flex:1}.info b{display:block;font-size:.95rem}.info span{font-size:.78rem;color:var(--muted)}
.tag{font-size:.72rem;font-weight:800;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:#cbd5e1}
.footer-note{text-align:center;color:#64748b;font-size:.78rem;margin-top:20px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.panel{padding:16px}.wrap{padding-top:20px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🎡 Roleta do Rolê</h1>
  <p>Sem discussão. A roleta decide onde comer em Canaã dos Carajás.</p>
</header>
<div class="grid">
  <section class="panel">
    <div class="wheel-area">
      <div class="pointer"></div>
      <canvas id="wheel" width="700" height="700"></canvas>
    </div>
    <button class="spin" id="spin">GIRAR A ROLETA</button>
  </section>
  <aside class="panel">
    <div class="result" id="result">
      <small>Destino da noite</small>
      <h2>Quem vai escolher?</h2>
      <p>Clique em girar e deixe a sorte resolver.</p>
    </div>
    <div class="list" id="list"></div>
  </aside>
</div>
<div class="footer-note">Lista montada com estabelecimentos encontrados em Canaã dos Carajás • confirme horário antes de sair.</div>
</div>
<script>
const places=[
 {name:"Tex Burguer",type:"Hamburgueria",emoji:"🍔"},
 {name:"Blue Chips Burger",type:"Hamburgueria",emoji:"🍔"},
 {name:"La Brasa Burger",type:"Hamburgueria",emoji:"🔥"},
 {name:"Brasa's Burguer",type:"Hamburgueria",emoji:"🥩"},
 {name:"Quality Pizzaria",type:"Pizzaria",emoji:"🍕"},
 {name:"Nap'S Pizzaria",type:"Pizzaria",emoji:"🍕"},
 {name:"Pizzaria Artezanale",type:"Pizzaria",emoji:"🍕"},
 {name:"Sr. Petisco",type:"Petiscaria",emoji:"🍟"},
 {name:"Texano",type:"Bar",emoji:"🍻"},
 {name:"Conexão Espetaria",type:"Espetaria",emoji:"🍢"}
];
const colors=["#ef4444","#f97316","#eab308","#22c55e","#14b8a6","#06b6d4","#3b82f6","#8b5cf6","#d946ef","#f43f5e"];
const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d");
const list=document.getElementById("list"),result=document.getElementById("result"),btn=document.getElementById("spin");
let rotation=0,spinning=false;
places.forEach((p,i)=>{
 const row=document.createElement("div"); row.className="place"; row.id="p"+i;
 row.innerHTML=`<span class="dot" style="background:${colors[i]}"></span><div class="info"><b>${p.emoji} ${p.name}</b><span>${p.type}</span></div><span class="tag">Canaã</span>`;
 list.appendChild(row);
});
function draw(){
 const cx=350,cy=350,r=330,slice=Math.PI*2/places.length;
 ctx.clearRect(0,0,700,700); ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);
 places.forEach((p,i)=>{
   const a=i*slice-Math.PI/2;
   ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a,a+slice);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();
   ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=3;ctx.stroke();
   ctx.save();ctx.rotate(a+slice/2);ctx.translate(r*.62,0);ctx.rotate(Math.PI/2);
   ctx.fillStyle="#fff";ctx.font="800 20px system-ui";ctx.textAlign="center";ctx.shadowColor="rgba(0,0,0,.55)";ctx.shadowBlur=5;
   const label=p.name.length>18?p.name.slice(0,17)+"…":p.name;ctx.fillText(label,0,0);ctx.restore();
 });
 ctx.beginPath();ctx.arc(0,0,66,0,Math.PI*2);ctx.fillStyle="#0f172a";ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=7;ctx.stroke();
 ctx.font="38px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("🍴",0,2);ctx.restore();
}
function winnerIndex(){
 const slice=Math.PI*2/places.length;
 let normalized=(((-rotation)%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
 return Math.floor((normalized+slice/2)% (Math.PI*2)/slice);
}
function highlight(i){document.querySelectorAll(".place").forEach(x=>x.classList.remove("active"));document.getElementById("p"+i).classList.add("active")}
btn.onclick=()=>{
 if(spinning)return; spinning=true;btn.disabled=true;btn.textContent="RODANDO...";
 const start=rotation,extra=(6+Math.random()*5)*Math.PI*2+Math.random()*Math.PI*2,duration=4800,startTime=performance.now();
 function anim(now){
   let t=Math.min((now-startTime)/duration,1),ease=1-Math.pow(1-t,4);rotation=start+extra*ease;draw();
   if(t<1)requestAnimationFrame(anim);else{
     spinning=false;btn.disabled=false;btn.textContent="GIRAR DE NOVO";
     const i=winnerIndex(),p=places[i];highlight(i);
     result.innerHTML=`<small>🎉 O rolê escolhido foi</small><h2>${p.emoji} ${p.name}</h2><p>${p.type} • Canaã dos Carajás</p>`;
   }
 } requestAnimationFrame(anim);
};
draw();
</script>
</body>
</html>
